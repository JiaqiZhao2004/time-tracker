AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Time Tracker FastAPI backend on AWS Lambda and API Gateway HTTP API

Parameters:
  TimeTrackerTableName:
    Type: String
    Default: time-tracker-v2
    Description: Existing DynamoDB table used by the backend.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,https://dxvboogtj4a4b.cloudfront.net
    Description: Browser origins allowed to call the HTTP API.
  AuthCallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173,https://dxvboogtj4a4b.cloudfront.net
    Description: Cognito Hosted UI callback URLs for the frontend.
  AuthLogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173,https://dxvboogtj4a4b.cloudfront.net
    Description: Cognito Hosted UI logout redirect URLs for the frontend.
  CognitoDomainPrefix:
    Type: String
    Default: time-tracker-jiaqizhao2004
    Description: Globally unique Cognito Hosted UI domain prefix.
  GoogleOAuthClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth web client id for Cognito federation.
  GoogleOAuthClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth web client secret for Cognito federation.
  AllowedUserEmails:
    Type: String
    Description: Comma-separated Google email addresses allowed to use the app.

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 10

Resources:
  TimeTrackerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  TimeTrackerGoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref TimeTrackerUserPool
      ProviderName: Google
      ProviderType: Google
      AttributeMapping:
        email: email
        name: name
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Ref GoogleOAuthClientSecret
        authorize_scopes: openid email profile

  TimeTrackerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - TimeTrackerGoogleProvider
    Properties:
      UserPoolId: !Ref TimeTrackerUserPool
      ClientName: time-tracker-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - Google
      CallbackURLs: !Ref AuthCallbackUrls
      LogoutURLs: !Ref AuthLogoutUrls
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours

  TimeTrackerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref TimeTrackerUserPool

  TimeTrackerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${TimeTrackerUserPool}
              audience:
                - !Ref TimeTrackerUserPoolClient
      CorsConfiguration:
        AllowCredentials: true
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowOrigins: !Ref AllowedOrigins
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Time Tracker API
          version: "1.0"
        paths: {}

  TimeTrackerBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: main.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TimeTrackerTableName
          ALLOWED_USER_EMAILS: !Ref AllowedUserEmails
          LOG_LEVEL: INFO
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: AccessTimeTrackerTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TimeTrackerTableName}
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /me
            Method: GET
            PayloadFormatVersion: "2.0"
        UpdateMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /me
            Method: PATCH
            PayloadFormatVersion: "2.0"
        GetCategories:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /categories
            Method: GET
            PayloadFormatVersion: "2.0"
        CreateCategory:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /categories
            Method: POST
            PayloadFormatVersion: "2.0"
        UpdateCategoryStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /categories/{category_id}
            Method: PATCH
            PayloadFormatVersion: "2.0"
        CreateEntry:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /entries
            Method: POST
            PayloadFormatVersion: "2.0"
        GetEntriesLocal:
          Type: HttpApi
          Properties:
            ApiId: !Ref TimeTrackerApi
            Path: /entries-local
            Method: GET
            PayloadFormatVersion: "2.0"

Outputs:
  ApiBaseUrl:
    Description: Configure the frontend VITE_API_BASE value with this URL.
    Value: !Sub https://${TimeTrackerApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Description: Name of the deployed backend Lambda function.
    Value: !Ref TimeTrackerBackendFunction
  CognitoUserPoolId:
    Description: Cognito user pool id.
    Value: !Ref TimeTrackerUserPool
  CognitoUserPoolClientId:
    Description: Configure VITE_COGNITO_CLIENT_ID with this value.
    Value: !Ref TimeTrackerUserPoolClient
  CognitoAuthority:
    Description: Configure VITE_COGNITO_AUTHORITY with this issuer URL.
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${TimeTrackerUserPool}
  CognitoHostedUiDomain:
    Description: Configure VITE_COGNITO_DOMAIN with this value.
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  GoogleOAuthRedirectUri:
    Description: Add this authorized redirect URI in the Google OAuth client.
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
