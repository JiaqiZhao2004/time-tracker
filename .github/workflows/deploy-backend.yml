name: Deploy backend Lambda with SAM

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: python -m pytest backend/tests

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build backend Lambda
        run: sam build --use-container

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050092888:role/TimeTrackerGitHubActionsBackendDeploy
          aws-region: us-east-2

      - name: Deploy backend Lambda
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
