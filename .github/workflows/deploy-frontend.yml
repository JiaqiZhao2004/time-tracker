name: Deploy static site to S3

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: https://sicch7vuv7.execute-api.us-east-2.amazonaws.com
          VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_AUTH_REDIRECT_URI: https://dxvboogtj4a4b.cloudfront.net
          VITE_AUTH_LOGOUT_URI: https://dxvboogtj4a4b.cloudfront.net
        run: npm run build

      # If you're using Vite/Vue/React, your output is usually dist/ (or build/)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050092888:role/TimeTrackerGitHubActionsFrontendDeploy
          aws-region: us-east-2

      - name: Sync to S3
        run: |
          aws s3 sync ./frontend/dist s3://time-tracker-frontend-jiaqizhao2004/ --delete

      # Optional: CloudFront cache invalidation
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3L17E74FPN9PG --paths "/*"
